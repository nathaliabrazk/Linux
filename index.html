<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Treine comandos Linux com o Tux.">
  <title>BinTuts Quiz · Comandos Linux RHEL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Tux reutilizável: <svg><use href="#tux"/></svg> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="tux" viewBox="0 0 100 120">
      <ellipse cx="32" cy="112" rx="15" ry="6" fill="#f5c518"/>
      <ellipse cx="68" cy="112" rx="15" ry="6" fill="#f5c518"/>
      <ellipse cx="17" cy="74" rx="8" ry="22" transform="rotate(14 17 74)" fill="#262d38" stroke="#3b4556" stroke-width="1.5"/>
      <ellipse cx="83" cy="74" rx="8" ry="22" transform="rotate(-14 83 74)" fill="#262d38" stroke="#3b4556" stroke-width="1.5"/>
      <ellipse cx="50" cy="66" rx="34" ry="46" fill="#262d38" stroke="#3b4556" stroke-width="1.5"/>
      <ellipse cx="50" cy="80" rx="22" ry="32" fill="#f3f4f6"/>
      <circle cx="41" cy="35" r="6.5" fill="#fff"/>
      <circle cx="59" cy="35" r="6.5" fill="#fff"/>
      <circle cx="42" cy="36" r="2.8" fill="#0b0d10"/>
      <circle cx="58" cy="36" r="2.8" fill="#0b0d10"/>
      <path d="M38 46 Q50 38 62 46 Q50 60 38 46Z" fill="#f5c518"/>
    </symbol>
  </svg>

  <header class="topbar">
    <a class="brand" href="#inicio" id="brand-home" aria-label="BinTuts Quiz, início">
      <svg class="brand-tux" aria-hidden="true"><use href="#tux"/></svg>
      <span>tux<span class="brand-accent">@quiz</span></span>
    </a>
    <span class="topbar-note"><span class="status-dot"></span> sessão ativa</span>
  </header>

  <main class="page" id="inicio">
    <section id="start-view" class="start" aria-labelledby="page-title">
      <svg class="hero-tux" role="img" aria-label="Tux, o pinguim do Linux"><use href="#tux"/></svg>
      <h1 id="page-title">Quiz de comandos Linux RHEL</h1>
      <p>Responda cada pergunta com o comando certo. Digitar no terminal fixa o conteúdo; este quiz ajuda a revisar.</p>
      <button class="next-button" id="start-button" type="button">Iniciar quiz <span aria-hidden="true">→</span></button>
      <p class="start-meta" id="start-meta"></p>
    </section>

    <section id="quiz-view" class="quiz-card" aria-label="Questionário" hidden>
      <div class="quiz-header">
        <div class="quiz-label"><svg class="mini-tux" aria-hidden="true"><use href="#tux"/></svg> <span id="active-quiz-title">Comandos Linux</span></div>
        <span class="question-count" id="question-count"></span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Progresso do questionário" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div id="quiz-content" aria-live="polite">
        <div class="question-meta" id="question-topic"></div>
        <h2 class="question-title" id="question-title"></h2>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback" hidden></div>
        <div class="card-footer">
          <span class="keyboard-hint">Escolha uma resposta para continuar</span>
          <div class="quiz-actions">
            <button class="next-button secondary-button" id="back-question" type="button" hidden><span aria-hidden="true">←</span> Voltar</button>
            <button class="next-button" id="next-button" type="button" disabled>Conferir resposta <span aria-hidden="true">→</span></button>
          </div>
        </div>
      </div>
      <div id="result" class="result" hidden aria-live="polite"></div>
    </section>
  </main>
  <footer>Feito para quem está estudando Linux. Boa prova!</footer>
</body>
</html>
